[project]
name = "statusboard"
version = "0.1.0"
description = "Poll public cloud status feeds into SQLite and render one dashboard."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
statusboard = "statusboard.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["statusboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
